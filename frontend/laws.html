<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Laws, Culture &amp; Etiquette — YatraMitra</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
        .state-hero-card {
            background: linear-gradient(135deg, #fbf7f0 0%, #f4ede0 100%);
            border: 1px solid var(--gold-light);
            border-left: 5px solid var(--maroon);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .state-hero-card h2 {
            color: var(--maroon-dark);
            margin-top: 0;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .laws-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        @media (min-width: 680px) {
            .laws-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .law-item {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 1.1rem;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .law-item h3 {
            font-size: 1.05rem;
            color: var(--maroon-dark);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .law-item p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--ink);
            line-height: 1.5;
        }
        .section-header {
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--ivory-dim);
            padding-bottom: 0.5rem;
        }
        .section-header h2 {
            font-size: 1.35rem;
            color: var(--ink);
            margin: 0;
        }
        .disclaimer-box {
            font-size: 0.84rem;
            color: var(--ink-soft);
            background: var(--ivory-dim);
            border: 1px dashed var(--line);
            border-radius: var(--radius-md);
            padding: 0.85rem 1.1rem;
            margin-top: 2.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <header id="ym-header" class="site-header"></header>

    <main class="page">
        <div class="page-hero">
            <h1>Laws, Culture &amp; Etiquette</h1>
            <p class="lede">Essential travel regulations, cultural etiquette, and regional dining tips for visiting India.</p>
        </div>

        <!-- State Selector Bar -->
        <div class="search-bar" style="margin-bottom: 1.5rem;">
            <div class="filter-row">
                <select id="state-select" aria-label="Select state for local rules">
                    <option value="">All India (National Guidelines)</option>
                </select>
            </div>
        </div>

        <!-- Dynamic State Card (Hidden when All India is selected) -->
        <div id="state-highlight-container" hidden>
            <div class="state-hero-card">
                <h2 id="state-title">State Guidelines</h2>
                <div id="state-content" style="display:flex; flex-direction:column; gap:1rem; margin-top:0.75rem;">
                    <!-- Filled dynamically -->
                </div>
            </div>
        </div>

        <!-- Loading / Error message -->
        <div id="laws-loading" style="color:var(--ink-soft); padding:1rem 0;">Loading guidelines…</div>
        <div id="laws-error" class="banner banner--alert" hidden></div>

        <!-- Main Content Area -->
        <div id="laws-main-content" hidden>
            <!-- 1. National Travel Regulations -->
            <div class="section-header">
                <h2>⚖️ National Travel Laws &amp; Regulations</h2>
            </div>
            <div class="laws-grid" id="national-laws-list"></div>

            <!-- 2. Cultural Customs & Etiquette -->
            <div class="section-header">
                <h2>🙏 Cultural Etiquette &amp; Social Customs</h2>
            </div>
            <div class="laws-grid" id="general-culture-list"></div>

            <!-- 3. Food & Dining Etiquette -->
            <div class="section-header">
                <h2>🍛 Food Culture &amp; Dining Norms</h2>
            </div>
            <div class="laws-grid" id="general-food-list"></div>

            <!-- Disclaimer -->
            <div class="disclaimer-box" id="laws-disclaimer"></div>
        </div>
    </main>

    <div id="ym-bottom-nav"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/laws.js"></script>
</body>

</html>
