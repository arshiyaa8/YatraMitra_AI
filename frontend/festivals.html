<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Festivals — YatraMitra</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header id="ym-header" class="site-header"></header>

    <main class="page">
        <section class="page-hero">
            <h1>Festivals</h1>
            <p>What's happening now, and what's coming up — useful for timing a visit or expecting bigger crowds.</p>
            <div class="filter-row">
                <select id="festival-state-filter" aria-label="Filter by state">
                    <option value="">All states</option>
                    <option value="ALL">Nationwide only</option>
                </select>
            </div>
        </section>

        <section>
            <h2>Happening now</h2>
            <div id="active-festivals"></div>
        </section>

        <section>
            <h2>Upcoming</h2>
            <div id="upcoming-festivals"></div>
        </section>
    </main>

    <div id="ym-bottom-nav"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/festivals.js"></script>
</body>

</html>
