<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="50%" stop-color="#1a2238" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#e6af2e" />
      <stop offset="100%" stop-color="#c68a15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Heritage Dome & Arch Motif -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Base Temple / Monument Structure -->
    <path d="M-120 100 L120 100 L110 50 L-110 50 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M-100 50 L100 50 L80 0 L-80 0 Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Central Arch Gateway -->
    <path d="M-45 100 L-45 40 Q0 0 45 40 L45 100 Z" fill="#1a2238" stroke="url(#goldGrad)" stroke-width="6" />
    
    <!-- Mughal / Rajput Onion Dome -->
    <path d="M0 -110 C-15 -60 -90 -40 -90 0 C-90 0 90 0 90 0 C90 -40 15 -60 0 -110 Z" fill="url(#goldGrad)" />
    
    <!-- Spire (Kalasha) -->
    <path d="M0 -140 L4 -115 L-4 -115 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-142" r="5" fill="#fff" filter="url(#glow)" />
  </g>

  <!-- AI Sparkle Star (Top Right) -->
  <g transform="translate(380, 130) scale(1.1)" filter="url(#glow)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#ffe082" />
  </g>

  <!-- AI Secondary Sparkle (Left) -->
  <g transform="translate(120, 190) scale(0.65)" opacity="0.85">
    <path d="M0 -25 Q0 0 25 0 Q0 0 0 25 Q0 0 -25 0 Q0 0 0 -25 Z" fill="#ffd54f" />
  </g>
</svg>
