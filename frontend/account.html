<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account — YatraMitra</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header id="ym-header" class="site-header"></header>

    <main class="page page--narrow">
        <div id="logged-in-view" class="panel" hidden>
            <h1>Your account</h1>
            <dl class="fact-list" id="account-details"></dl>
            <button id="logout-btn" class="btn btn--ghost">Log out</button>
        </div>

        <div id="auth-forms" class="auth-tabs">
            <div class="tab-buttons" role="tablist">
                <button class="tab-btn tab-btn--active" data-tab="login" role="tab">Log in</button>
                <button class="tab-btn" data-tab="register" role="tab">Create account</button>
            </div>

            <form id="login-form" class="panel auth-form">
                <h2>Log in</h2>
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required autocomplete="email" />
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required autocomplete="current-password" />
                <button type="submit" class="btn btn--primary">Log in</button>
                <p class="form-status" id="login-status" role="status"></p>
            </form>

            <form id="register-form" class="panel auth-form" hidden>
                <h2>Create account</h2>
                <label for="register-name">Name</label>
                <input type="text" id="register-name" required autocomplete="name" />
                <label for="register-email">Email</label>
                <input type="email" id="register-email" required autocomplete="email" />
                <label for="register-password">Password</label>
                <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
                <p class="field-hint">At least 6 characters.</p>
                <button type="submit" class="btn btn--primary">Create account</button>
                <p class="form-status" id="register-status" role="status"></p>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/account.js"></script>
</body>

</html>
