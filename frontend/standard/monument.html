<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="css/standard.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 26V14C4 7.4 8.9 2 15 2C21.1 2 26 7.4 26 14V26" stroke="#9C4A2E" stroke-width="2.4"/>
        <path d="M9 26V15C9 10.6 11.7 7 15 7C18.3 7 21 10.6 21 15V26" stroke="#B8862B" stroke-width="1.8"/>
      </svg>
      Vistaara
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="explore.html">Explore</a>
      <a href="index.html#features">How it helps</a>
      <a href="index.html#destinations">Destinations</a>
    </nav>
    <a class="mode-switch" href="../accessibility/monument.html">Accessible version</a>
  </div>
</header>

<main id="main">
  <div id="monument-detail">
    <section class="monument-hero">
      <div class="wrap">
        <a class="back-link" href="explore.html">&larr; Back to explore</a>
        <p class="eyebrow" id="monument-region" style="color:#E7C98F;"></p>
        <h1 id="monument-name"></h1>
      </div>
    </section>

    <section class="monument-body">
      <div class="wrap">
        <p id="monument-tagline"></p>

        <div class="ask-box">
          <h2>Ask about this destination</h2>
          <form onsubmit="event.preventDefault();">
            <label for="ask-input" class="visually-hidden">Your question</label>
            <input type="text" id="ask-input" placeholder="e.g. What's the best time to visit?">
            <button type="submit" class="btn btn-primary">Ask</button>
          </form>
          <p style="font-size:0.82rem; color:var(--ink-soft); margin-top:10px;">
            This will connect to the multilingual Q&amp;A assistant once the backend is live.
          </p>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Vistaara &middot; An SIH project</p>
    <p>Built with data from ASI, the Indian Culture Portal, and Bhuvan</p>
  </div>
</footer>
