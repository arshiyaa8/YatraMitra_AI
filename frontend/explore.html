<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Explore Monuments — YatraMitra</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Leaflet CSS for Interactive OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius-md);
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            font-family: inherit;
        }
        .leaflet-popup-content {
            margin: 0;
            line-height: 1.4;
        }
        .map-popup-card {
            padding: 0.85rem 1rem 1rem;
            min-width: 200px;
            max-width: 260px;
        }
        .map-popup-arch {
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            padding: 0.4rem 0.8rem;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .map-popup-card h4 {
            margin: 0 0 0.25rem;
            font-size: 1rem;
            color: var(--maroon-dark);
        }
        .map-popup-card p {
            margin: 0 0 0.5rem;
            font-size: 0.85rem;
            color: var(--ink-soft);
        }
        .map-popup-link {
            display: inline-block;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--maroon);
            text-decoration: none;
        }
        .map-popup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <header id="ym-header" class="site-header"></header>

    <div id="alert-banner-host"></div>
    <div id="festival-banner-host"></div>

    <main class="page">
        <section class="page-hero">
            <h1>Explore heritage sites</h1>
            <p>Search by name, state, or region. Every result comes from the live monument database.</p>

            <form class="search-bar" id="search-form" role="search">
                <label for="search-input" class="visually-hidden">Search monuments</label>
                <input type="search" id="search-input" placeholder="e.g. Taj Mahal, Rajasthan, forts…"
                    autocomplete="off" />
                <div class="filter-row">
                    <select id="state-filter" aria-label="Filter by state">
                        <option value="">All states</option>
                    </select>
                    <select id="category-filter" aria-label="Filter by category">
                        <option value="">All categories</option>
                        <option value="monument">Monument</option>
                        <option value="temple">Temple</option>
                        <option value="fort">Fort</option>
                        <option value="museum">Museum</option>
                        <option value="natural">Natural site</option>
                        <option value="wildlife">Wildlife</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn btn--primary">Search</button>
            </form>

            <div class="filter-row" style="margin-top: 0.75rem;">
                <label class="toggle-row" for="underexplored-toggle" style="margin:0;">
                    <input type="checkbox" id="underexplored-toggle" style="width:auto; min-height:auto;" />
                    Underexplored gems only
                </label>
                <button type="button" class="btn btn--ghost btn--sm" id="near-me-btn">📍 Near me</button>
            </div>
            <p class="field-hint" id="near-me-status"></p>
        </section>

        <!-- View Controls & Results Bar -->
        <section aria-live="polite">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem;">
                <div id="results-status" class="results-status" style="margin:0;"></div>
                <div class="view-switch" role="group" aria-label="View mode" style="display:flex; gap:0.4rem;">
                    <button type="button" id="view-cards-btn" class="chip-toggle chip-toggle--active">🗂️ Cards</button>
                    <button type="button" id="view-map-btn" class="chip-toggle">🗺️ Interactive Map</button>
                </div>
            </div>

            <!-- Map View Container (Toggled via view-map-btn) -->
            <div id="map-view-container" hidden style="margin-bottom: 2rem;">
                <div id="explore-map" style="height: 520px; width: 100%; border-radius: var(--radius-md); border: 1px solid var(--line); box-shadow: var(--shadow-card);" role="region" aria-label="Interactive map of Indian heritage monuments"></div>
            </div>

            <!-- Cards Grid Container (Default view) -->
            <div id="destination-grid" class="card-grid"></div>
            <div class="pagination" id="pagination"></div>
        </section>
    </main>

    <div id="ym-bottom-nav"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/explore.js"></script>
</body>

</html>
